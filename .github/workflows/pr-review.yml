name: PR Review

# Runs on every PR into main (including each new push to the PR's branch,
# e.g. development) and on pushes to main so CodeQL has a baseline to compare against.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel an in-progress run when a newer commit is pushed to the same PR/branch
concurrency:
  group: pr-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      # Same MongoDB version as production
      mongodb:
        image: mongo:8.0.9-noble
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_TEST_URI: mongodb://localhost:27017
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # sharp ships prebuilt binaries as optional dependencies, so install
      # scripts can stay off here too
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Fails on high or critical advisories. Moderate/low are reported but do not block.
      - name: Run npm audit
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Community rule packs for Node/Express APIs. --error fails the job on any finding.
      - name: Run Semgrep
        run: >
          semgrep scan
          --config p/javascript
          --config p/nodejs
          --config p/expressjs
          --config p/jwt
          --config p/secrets
          --metrics off
          --error

  # One email per PR run with the overall result (passed or failed), so
  # GitHub's per-run Actions emails can be turned off. Runs after every
  # check whether it passed or failed, but not when a newer push cancelled
  # the run. Needs repository secrets SMTP_HOST, SMTP_USER, SMTP_PASS,
  # SMTP_FROM and NOTIFY_EMAIL; without them it only logs a warning.
  notify:
    name: Email summary
    needs: [lint, test, audit, codeql, semgrep]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Only nodemailer is needed; the lockfile keeps it at the API's version
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts

      # PR title and other event values are passed as environment variables,
      # never pasted into the script, so a title cannot inject shell commands
      - name: Send summary email
        run: node .github/scripts/pr-summary-email.js
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
