version: 2
updates:
  # npm dependencies. PRs target development so they go through the normal PR Review flow.
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keeps the action versions used in .github/workflows up to date
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
